name: Agentskill Drift
description: Run Agentskill drift checks and publish an advisory report.

inputs:
  version:
    description: Agentskill release tag to install, for example 2.1.0.
    required: true

  signature:
    description: Signature mode passed to agentskill drift.
    required: false
    default: auto

outputs:
  report-path:
    description: Path to the JSON drift report.
    value: ${{ steps.drift-unix.outputs.report_path || steps.drift-windows.outputs.report_path }}

  stale:
    description: Whether the report contains stale provenance.
    value: ${{ steps.drift-unix.outputs.stale || steps.drift-windows.outputs.stale }}

runs:
  using: composite

  steps:
    - id: install-unix
      name: Install Agentskill On Unix
      if: runner.os != 'Windows'
      shell: bash

      env:
        AGENTSKILL_VERSION: ${{ inputs.version }}

      run: |
        set -euo pipefail

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) target="x86_64-unknown-linux-gnu"; archive="tar.gz" ;;
          Linux-ARM64) target="aarch64-unknown-linux-gnu"; archive="tar.gz" ;;
          macOS-X64) target="x86_64-apple-darwin"; archive="tar.gz" ;;
          macOS-ARM64) target="aarch64-apple-darwin"; archive="tar.gz" ;;
          *) echo "Unsupported Agentskill runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
        esac

        release_version="${AGENTSKILL_VERSION%-rc.*}"
        package="agentskill-${release_version}-${target}"
        archive_path="${RUNNER_TEMP}/${package}.${archive}"
        checksums_path="${RUNNER_TEMP}/agentskill/SHA256SUMS"
        install_dir="${RUNNER_TEMP}/agentskill/bin"
        mkdir -p "$install_dir"
        curl --fail --silent --show-error --location \
          "https://github.com/airscripts/agentskill/releases/download/${AGENTSKILL_VERSION}/${package}.${archive}" \
          --output "$archive_path"
        curl --fail --silent --show-error --location \
          "https://github.com/airscripts/agentskill/releases/download/${AGENTSKILL_VERSION}/SHA256SUMS" \
          --output "$checksums_path"
        expected_checksum="$(awk -v package="$package" '$2 == package {print $1}' "$checksums_path")"
        test -n "$expected_checksum"
        printf '%s  %s\n' "$expected_checksum" "$archive_path" | sha256sum --check --status -
        tar -xzf "$archive_path" -C "$RUNNER_TEMP"
        install -m 0755 "${RUNNER_TEMP}/${package}/agentskill" "$install_dir/agentskill"
        echo "$install_dir" >> "$GITHUB_PATH"

    - id: install-windows
      name: Install Agentskill On Windows
      if: runner.os == 'Windows'
      shell: pwsh

      env:
        AGENTSKILL_VERSION: ${{ inputs.version }}

      run: |
        $ErrorActionPreference = 'Stop'
        $target = switch ("$env:RUNNER_ARCH") {
          'X64' { 'x86_64-pc-windows-msvc' }
          'ARM64' { 'aarch64-pc-windows-msvc' }
          default { throw "Unsupported Agentskill runner: $env:RUNNER_OS-$env:RUNNER_ARCH" }
        }
        $releaseVersion = $env:AGENTSKILL_VERSION -replace '-rc\..*$', ''
        $package = "agentskill-$releaseVersion-$target"
        $archivePath = Join-Path $env:RUNNER_TEMP "$package.zip"
        $checksumsPath = Join-Path $env:RUNNER_TEMP 'agentskill/SHA256SUMS'
        $installDir = Join-Path $env:RUNNER_TEMP 'agentskill/bin'
        New-Item -ItemType Directory -Force -Path $installDir | Out-Null
        Invoke-WebRequest -Uri "https://github.com/airscripts/agentskill/releases/download/$env:AGENTSKILL_VERSION/$package.zip" -OutFile $archivePath
        Invoke-WebRequest -Uri "https://github.com/airscripts/agentskill/releases/download/$env:AGENTSKILL_VERSION/SHA256SUMS" -OutFile $checksumsPath
        $expectedChecksum = Get-Content $checksumsPath |
          Where-Object { $_ -match "\s$([regex]::Escape($package))$" } |
          ForEach-Object { ($_ -split '\s+')[0] } |
          Select-Object -First 1
        if ([string]::IsNullOrWhiteSpace($expectedChecksum)) { throw "Checksum is missing for $package" }
        $actualChecksum = (Get-FileHash $archivePath -Algorithm SHA256).Hash
        if ($actualChecksum.ToLowerInvariant() -ne $expectedChecksum.ToLowerInvariant()) {
          throw "Checksum verification failed for $package"
        }
        Expand-Archive -LiteralPath $archivePath -DestinationPath $env:RUNNER_TEMP -Force
        Copy-Item (Join-Path $env:RUNNER_TEMP "$package/agentskill.exe") (Join-Path $installDir 'agentskill.exe')
        Add-Content -Path $env:GITHUB_PATH -Value $installDir

    - id: drift-unix
      name: Run Agentskill Drift On Unix
      if: runner.os != 'Windows'
      shell: bash

      env:
        AGENTSKILL_SIGNATURE: ${{ inputs.signature }}

      run: |
        set -euo pipefail

        report="${RUNNER_TEMP}/agentskill-drift/drift.json"
        mkdir -p "$(dirname "$report")"
        agentskill drift "$GITHUB_WORKSPACE" --signature "$AGENTSKILL_SIGNATURE" --pretty > "$report"
        stale="$(jq -r '.stale' "$report")"
        echo "report_path=$report" >> "$GITHUB_OUTPUT"
        echo "stale=$stale" >> "$GITHUB_OUTPUT"
        {
          echo '### Agentskill Report'
          echo
          echo 'Agentskill completed an advisory drift check for this repository.'
          echo
          echo "The check does not block the workflow; any findings are included in the full JSON report, available at \`$report\`."
        } >> "$GITHUB_STEP_SUMMARY"

    - id: drift-windows
      name: Run Agentskill Drift On Windows
      if: runner.os == 'Windows'
      shell: pwsh

      env:
        AGENTSKILL_SIGNATURE: ${{ inputs.signature }}

      run: |
        $ErrorActionPreference = 'Stop'
        $report = Join-Path $env:RUNNER_TEMP 'agentskill-drift/drift.json'
        New-Item -ItemType Directory -Force -Path (Split-Path $report) | Out-Null
        & agentskill drift $env:GITHUB_WORKSPACE --signature $env:AGENTSKILL_SIGNATURE --pretty | Out-File -FilePath $report -Encoding utf8NoBOM
        $payload = Get-Content -Raw $report | ConvertFrom-Json
        "report_path=$report" >> $env:GITHUB_OUTPUT
        "stale=$($payload.stale.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        @"
        ### Agentskill Report

        Agentskill completed an advisory drift check for this repository.

        The check does not block the workflow; any findings are included in the full JSON report, available at ``$report``.
        "@ >> $env:GITHUB_STEP_SUMMARY
