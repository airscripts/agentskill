name: Agentskill

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""

  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: rust:1.89-bookworm

    steps:
      - uses: actions/checkout@v7
        name: Checkout Code

        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Git
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Guidance Drift
        run: |
          set -euo pipefail

          cargo run --locked --bin agentskill -- drift "$GITHUB_WORKSPACE" --signature auto --pretty > drift.json

      - name: Write Drift Summary
        run: |
          {
            echo '### Agentskill Report'
            echo
            echo 'Agentskill completed an advisory drift check for this repository.'
            echo
            echo 'The check does not block the workflow; any findings are included in the uploaded JSON report.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        name: Upload Drift Report
        with:
          name: agentskill-drift-report
          path: drift.json
          if-no-files-found: error

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: rust:1.89-bookworm

    steps:
      - uses: actions/checkout@v7
        name: Checkout Code

        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Git
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Guidance Validation
        run: |
          set +e

          cargo run --locked --bin agentskill -- validate "$GITHUB_WORKSPACE" --signature auto --pretty > validate.json
          status=$?
          {
            echo '### Agentskill Report'
            echo
            echo 'Agentskill completed document validation for this repository.'
            echo
            echo 'The full JSON report is included in the uploaded artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@v7
        name: Upload Validation Report
        if: always()
        with:
          name: agentskill-validation-report
          path: validate.json
          if-no-files-found: error
