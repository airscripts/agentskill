name: Agentskill

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""

  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: rust:1.89-bookworm

    steps:
      - uses: actions/checkout@v7
        name: Checkout Code

        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Git
        shell: bash

        run: |
          apt-get update
          apt-get install --no-install-recommends --yes git jq
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Agentskill
        shell: bash

        run: |
          set -euo pipefail

          cargo build --locked --bin agentskill
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - id: agentskill
        name: Check Guidance Drift
        uses: ./agentskill-actions/drift

        with:
          source: "true"
          signature: auto

      - uses: actions/upload-artifact@v7
        name: Upload Drift Report
        with:
          name: agentskill-drift-report
          path: ${{ steps.agentskill.outputs.report-path }}
          if-no-files-found: error

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: rust:1.89-bookworm

    steps:
      - uses: actions/checkout@v7
        name: Checkout Code

        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Git
        shell: bash

        run: |
          apt-get update
          apt-get install --no-install-recommends --yes git jq
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Agentskill
        shell: bash

        run: |
          set -euo pipefail

          cargo build --locked --bin agentskill
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - id: agentskill
        name: Check Guidance Validation
        uses: ./agentskill-actions/validate

        with:
          source: "true"
          signature: auto

      - uses: actions/upload-artifact@v7
        name: Upload Validation Report
        if: always()
        with:
          name: agentskill-validation-report
          path: ${{ steps.agentskill.outputs.report-path }}
          if-no-files-found: error
