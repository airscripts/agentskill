[workspace]
members = [
    "agentskill-core",
    "agentskill-analyzers",
    "agentskill-generation",
    "agentskill",
]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["airscripts"]
repository = "https://github.com/airscripts/agentskill"
homepage = "https://github.com/airscripts/agentskill"
documentation = "https://docs.rs/agentskill"

[workspace.dependencies]
agentskill-core = { path = "agentskill-core", version = "2.0.0" }
agentskill-analyzers = { path = "agentskill-analyzers", version = "2.0.0" }
agentskill-generation = { path = "agentskill-generation", version = "2.0.0" }
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.0"
